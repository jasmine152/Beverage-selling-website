<!DOCTYPE html>
<html>
<head>
<title>Sign Up | DrinkLuxe</title>

<style>
body{
font-family:Arial;
margin:0;
background:#f4f4f4;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
 background: url("https://images.squarespace-cdn.com/content/v1/57d9b89d9de4bb43099b7be3/1554151557275-WBO2P1IWCNJGHFSZJBRS/LisaDiederichPhotography_BobbyHotel_TavernCafe-10.jpg");
 background-size: cover;
  
}

.container{
background:white;
padding:40px;
border-radius:10px;
width:320px;
text-align:center;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

input{
width:100%;
padding:10px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

button{
width:100%;
padding:12px;
background:#ff9800;
border:none;
color:white;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#e68900;
}

</style>

</head>

<body>

<div class="container">

<h2>Create Account</h2>

<form onsubmit="signup(event)">

<!-- NAME -->
<input type="text" id="name" placeholder="Full Name"
required minlength="3">

<!-- EMAIL -->
<input type="email" id="email" placeholder="Email"
required>

<!-- PASSWORD -->
<input type="password" id="password" placeholder="Password"
required minlength="6"
pattern="(?=.*[0-9])(?=.*[a-z])(?=.*[A-Z]).{6,}"
title="Must contain at least 1 number, 1 uppercase, 1 lowercase letter">

<!-- PHONE (optional but validated) -->
<input type="tel" placeholder="Phone Number"
pattern="[0-9]{10}"
title="Enter 10 digit phone number">

<button type="submit" id="submit">Sign Up</button>

</form>

<p>Already have account? <a href="login pg.html">Login</a></p>

</div>

<script>
function signup(e){
  e.preventDefault();

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;
  let password = document.getElementById("password").value;

  /* SAVE USER */
  let user = {name, email, password};
  localStorage.setItem("userData", JSON.stringify(user));

  /* MARK USER AS LOGGED IN */
  localStorage.setItem("isLoggedIn", "true");

  /* NICE POPUP */
  alert("Account Created Successfully 🎉");

  /* REDIRECT TO HOME */
  window.location.href = "login pg.html";
}
</script>
</body>
</html>
