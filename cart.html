<!DOCTYPE html>
<html>
<head>
<title>Your Cart</title>

<style>

body{
font-family:Arial;
margin:0;
background:#f4f4f4;
}

/* NAVBAR */
nav{
background:#222;
padding:15px 40px;
display:flex;
justify-content:space-between;
align-items:center;
}

nav h1{ color:white; }

nav ul{
list-style:none;
display:flex;
}

nav ul li{ margin-left:20px; }

nav ul li a{
color:white;
text-decoration:none;
}

nav ul li a:hover{
color:#ff9800;
}

/* CONTAINER */
.container{
padding:40px;
}

/* CART ITEMS */
.cart-item{
display:flex;
align-items:center;
background:white;
margin-bottom:20px;
padding:15px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.cart-item img{
width:80px;
height:80px;
object-fit:cover;
border-radius:10px;
margin-right:20px;
}

.item-info{
flex:1;
}

.item-info h3{
margin:0;
}

.remove-btn{
background:red;
color:white;
border:none;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
}

.remove-btn:hover{
background:darkred;
}

/* TOTAL */
.total{
text-align:right;
font-size:20px;
margin-top:20px;
}

.clear-btn{
margin-top:20px;
padding:10px 20px;
background:#ff9800;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
}

.clear-btn:hover{
background:#e68900;
}

</style>

</head>

<body>

<nav>
<h1>DrinkLuxe</h1>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="menu.html">Menu</a></li>
<li><a href="offers.html">Offers</a></li>
<li><a href="about.html">About</a></li>
<li><a href="cart.html">Cart</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>
</nav>

<div class="container">

<h1>Your Cart</h1>

<div id="cart-container"></div>

<div class="total" id="total"></div>

<button class="clear-btn" onclick="clearCart()">Clear Cart</button>
<button class="clear-btn" onclick="placeOrder()">Place Order</button>

</div>


<script>


function loadCart(){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    let container = document.getElementById("cart-container");
    let total = 0;

    container.innerHTML = "";

    cart.forEach((item, index) => {

        total += parseFloat(item.price);

        container.innerHTML += `
        <div class="cart-item">
            <img src="${item.img}">
            <div class="item-info">
                <h3>${item.name}</h3>
                <p>$${item.price}</p>
            </div>
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
        </div>
        `;
    });

    if(cart.length === 0){
        container.innerHTML = "<h3>Your cart is empty 😢</h3>";
        document.getElementById("total").innerText = "";
    } else {
        document.getElementById("total").innerText = "Total: $" + total.toFixed(2);
    }
}

function removeItem(index){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];
    cart.splice(index,1);
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

function clearCart(){
    localStorage.removeItem("cart");
    loadCart();
}

/* ✅ ADD THIS FUNCTION HERE */
function placeOrder(){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if(cart.length === 0){
        alert("Your cart is empty!");
        return;
    }
    else{
        alert("Order is successfully placed");
        localStorage.removeItem("cart");
    loadCart();
    }

    const popup = document.getElementById("order-popup");

    popup.style.top = "20px";

    localStorage.removeItem("cart");
    loadCart();

    setTimeout(() => {
        popup.style.top = "-80px";
    }, 3000);
}

loadCart();




</script>

</body>
</html>
